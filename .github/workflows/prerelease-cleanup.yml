name: PR Pre-release Cleanup

# Deletes the pr-<N>-* pre-releases (and their tags) that ci.yml publishes for a pull request,
# once that PR is merged or closed.
on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete PR pre-release
    runs-on: ubuntu-latest
    # Fork PRs never get a pre-release (see ci.yml), and their token is read-only anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: prerelease-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Delete pre-release and tag
        run: |
          # pr-<N> is the tag used before per-run tags; "pr-<N>-" can't match another PR's tags.
          TAGS=$(gh release list --limit 1000 --json tagName \
            --jq ".[].tagName | select(. == \"pr-${PR_NUMBER}\" or startswith(\"pr-${PR_NUMBER}-\"))")
          if [ -z "$TAGS" ]; then
            echo "No pre-release for PR #${PR_NUMBER} to delete"
          fi
          for TAG in $TAGS; do
            if gh release delete "$TAG" --cleanup-tag --yes; then
              echo "Deleted pre-release $TAG"
            else
              echo "::warning::Could not delete pre-release $TAG"
            fi
          done

      - name: Update the pull request comment
        run: |
          MARKER='<!-- letra200bsharp-prerelease -->'
          COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" \
              -f body="${MARKER}
          ~~Pre-release~~ removed now that this PR is closed." >/dev/null
          fi
