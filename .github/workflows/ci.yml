name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger of the workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DESKTOP_PROJECT: Letra200bSharp.Avalonia.Desktop/Letra200bSharp.Avalonia.Desktop.csproj
  ANDROID_PROJECT: Letra200bSharp.Avalonia.Android/Letra200bSharp.Avalonia.Android.csproj
  LIBRARY_PROJECTS: >-
    Letra200bSharp/Letra200bSharp.csproj
    Letra200bSharp.200b/Letra200bSharp.200b.csproj
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

# Stages: Resolve Version -> Test (Linux, Windows, macOS) -> Pack NuGet
#                         -> Build (Windows, Linux, Android apps)
#                         -> Build docs
#         -> Pre-release (pull requests) / Tag & Release (main)
#         -> on a new release: Publish to GitHub Packages, Publish to nuget.org, Deploy docs
# Pre-release and release need every test, package and app build to succeed.
jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      # Full version stamped into the build and artifact names: "2.0.0" on main,
      # "2.0.0-pr.12.34" (PR number, workflow run number) on a pull request.
      version: ${{ steps.resolve.outputs.version }}
      version_prefix: ${{ steps.resolve.outputs.version_prefix }}
      version_suffix: ${{ steps.resolve.outputs.version_suffix }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version from BuildVersion.props
        id: resolve
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          PREFIX=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' BuildVersion.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "::error file=BuildVersion.props::No <VersionPrefix> found"
            exit 1
          fi

          if [ -n "$PR_NUMBER" ]; then
            SUFFIX="pr.${PR_NUMBER}.${RUN_NUMBER}"
            VERSION="${PREFIX}-${SUFFIX}"
          else
            SUFFIX=""
            VERSION="$PREFIX"
          fi

          {
            echo "version=$VERSION"
            echo "version_prefix=$PREFIX"
            echo "version_suffix=$SUFFIX"
          } >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$PREFIX" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            if [ -n "$PR_NUMBER" ]; then
              # Merging as-is wouldn't publish anything - say so while it's still cheap to fix.
              echo "::warning file=BuildVersion.props::v$PREFIX is already released - bump <VersionPrefix> before merging, or main won't publish a new release (add [no-new-version] to the commit message if that is intended)."
            else
              echo "::notice::Tag v$PREFIX already present - skip"
            fi
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### Version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write # trx-parser publishes a check run per TRX file
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-test-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props') }}
          restore-keys: nuget-test-${{ runner.os }}-

      # Protocol (including the ESC sequence-number regression), driver registration, the
      # renderer's features and history compatibility. net10.0 only, so no workload is needed.
      - name: Test
        shell: bash
        run: |
          dotnet test --project Letra200bSharp.Tests \
            -c Release \
            -p:TargetFrameworks=net10.0 \
            --results-directory TestResults \
            --report-trx \
            --report-trx-filename "${{ matrix.name }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: |
            TestResults/*.trx
            TestResults/*.html
          if-no-files-found: warn

      # A fork's pull request gets a read-only token, which can't create check runs.
      - name: Publish test reports
        if: >-
          always() && hashFiles('TestResults/*.trx') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: NasAmin/trx-parser@v0.8.1
        with:
          TRX_PATH: ${{ github.workspace }}/TestResults
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PREFIX: ${{ matrix.name }}

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [version, test]
    env:
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The LetraTag 200B driver also targets net10.0-android.
      - name: Install android workload
        run: dotnet workload install android

      - name: Pack
        run: |
          for PROJECT in $LIBRARY_PROJECTS; do
            dotnet pack "$PROJECT" \
              -c Release \
              -o artifacts \
              -p:VersionSuffix="$VERSION_SUFFIX" \
              -p:ContinuousIntegrationBuild=true \
              -p:EnableWindowsTargeting=true
          done
          ls -lh artifacts

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    needs: [version]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-docs-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props', 'dotnet-tools.json') }}
          restore-keys: nuget-docs-${{ runner.os }}-

      # DocFX reads the API reference from the built libraries and their XML docs (see
      # docs/docfx.json) - net10.0 only, so no workload is needed.
      - name: Build libraries
        run: |
          dotnet build Letra200bSharp.200b/Letra200bSharp.200b.csproj \
            -c Release \
            -p:TargetFrameworks=net10.0 \
            -p:CopyLocalLockFileAssemblies=true

      - name: Build site
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  # Published with each new release, so the site always documents the released packages.
  deploy-docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: [version, docs, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  build-windows:
    name: Build Windows (${{ matrix.rid }})
    runs-on: windows-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install android workload
        run: dotnet workload install android

      - name: Publish desktop app
        shell: bash
        run: |
          dotnet publish "$DESKTOP_PROJECT" \
            -c Release \
            -f net10.0-windows10.0.19041 \
            -p:TargetFrameworks=net10.0-windows10.0.19041 \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:VersionSuffix="$VERSION_SUFFIX" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -p:ContinuousIntegrationBuild=true \
            -o "artifacts/${{ matrix.rid }}"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" `
                           -DestinationPath "Letra200bSharp-$env:VERSION-${{ matrix.rid }}.zip"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: '*.zip'
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install android workload
        run: dotnet workload install android

      - name: Publish desktop app
        run: |
          dotnet publish "$DESKTOP_PROJECT" \
            -c Release \
            -f net10.0 \
            -p:TargetFrameworks=net10.0 \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:VersionSuffix="$VERSION_SUFFIX" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -p:ContinuousIntegrationBuild=true \
            -p:EnableWindowsTargeting=true \
            -o "artifacts/${{ matrix.rid }}"

      - name: Package
        run: |
          chmod +x "artifacts/${{ matrix.rid }}/Letra200bSharp.Avalonia.Desktop"
          tar -C "artifacts/${{ matrix.rid }}" \
              -czf "Letra200bSharp-${VERSION}-${{ matrix.rid }}.tar.gz" .

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: '*.tar.gz'
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props') }}
          restore-keys: nuget-android-

      - name: Install android workload
        run: dotnet workload install android

      # Release signing stays off for pull requests: PR code must never run with the release
      # keystore, so PR pre-release APKs are debug-signed (see the pre-release notes).
      - name: Prepare signing key
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/letra.keystore"
          echo "SIGNING_PROPS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/letra.keystore -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Publish APK
        run: |
          dotnet publish "$ANDROID_PROJECT" \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:VersionSuffix="$VERSION_SUFFIX" \
            -p:ContinuousIntegrationBuild=true \
            -p:EnableWindowsTargeting=true \
            $SIGNING_PROPS \
            -o artifacts/android

      - name: Package
        run: |
          APK="$(find artifacts/android -name '*-Signed.apk' -print -quit)"
          [ -n "$APK" ] || APK="$(find artifacts/android -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          cp "$APK" "Letra200bSharp-${VERSION}.apk"
          ls -lh Letra200bSharp-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: '*.apk'
          if-no-files-found: error

  prerelease:
    name: PR Pre-release
    runs-on: ubuntu-latest
    needs: [version, test, pack, build-windows, build-linux, build-android]
    # Same-repository PRs only. A fork's pull_request run gets a read-only token, and this
    # deliberately doesn't use pull_request_target: that would run untrusted fork code with a
    # write token. Fork PRs still build and upload workflow artifacts, just no GitHub pre-release.
    # Dependabot PRs are same-repo but GitHub also gives them a read-only token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    concurrency:
      group: prerelease-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BUILD_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect pre-release assets
        run: |
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.nupkg' -o -name '*.snupkg' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.zip, release/*.tar.gz, release/*.apk, release/*.nupkg, release/*.snupkg'

      # One pre-release per PR, replaced on every push so testers always have a single, current
      # link. Each run gets its own tag (pr-<N>-<run>-<attempt>): the repository uses immutable
      # releases, and a tag once used by one can never be reused, even after the release is
      # deleted. The tag deliberately isn't "v..." so it can never be mistaken for a real
      # release by the version job's tag check.
      - name: Publish pre-release
        run: |
          TAG="pr-${PR_NUMBER}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          cat > notes.md <<EOF
          Automatic pre-release for #${PR_NUMBER}: ${PR_TITLE}

          - Version: \`${VERSION}\`
          - PR head: ${HEAD_SHA}
          - Built from merge preview: ${BUILD_SHA}
          - Workflow run: ${RUN_URL}

          > [!WARNING]
          > Untested build of an unmerged pull request. It's replaced on every push and deleted when the PR is closed.
          > The Android APK is debug-signed: uninstall a release build of the app before installing it, and the other way round.
          EOF

          gh release create "$TAG" release/* \
            --prerelease \
            --latest=false \
            --target "$HEAD_SHA" \
            --title "PR #${PR_NUMBER} pre-release (${VERSION})" \
            --notes-file notes.md

          # Only now drop this PR's older pre-releases, so there's always one to link to.
          # pr-<N> is the tag used before per-run tags (failed runs left drafts on it);
          # "pr-<N>-" can't match another PR's tags (pr-3- vs pr-30-).
          gh release list --limit 1000 --json tagName \
            --jq ".[].tagName | select(. == \"pr-${PR_NUMBER}\" or startswith(\"pr-${PR_NUMBER}-\")) | select(. != \"${TAG}\")" |
          while read -r OLD; do
            gh release delete "$OLD" --cleanup-tag --yes || echo "::warning::Could not delete $OLD"
          done

      - name: Comment on the pull request
        run: |
          MARKER='<!-- letra200bsharp-prerelease -->'
          URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
          BODY="${MARKER}
          **Pre-release \`${VERSION}\` is ready:** ${URL}

          Windows, Linux and Android builds of ${HEAD_SHA}. Updated on every push, deleted when this PR is closed."

          COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [version, test, pack, build-windows, build-linux, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      statuses: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.nupkg' -o -name '*.snupkg' \) \
            -exec cp {} release/ \;
          ls -lh release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.zip, release/*.tar.gz, release/*.apk, release/*.nupkg, release/*.snupkg'

      - name: Tag release
        id: tag
        if: needs.version.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        id: gh_release
        if: steps.tag.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: release/*

      # A push that does not release on purpose (build, CI or docs changes) carries
      # [no-new-version] in a commit message: report success instead of a pending status.
      - name: Report release status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
        run: |
          if [ "${{ needs.version.outputs.tag_exists }}" = "true" ] && printf '%s' "$COMMIT_MESSAGES" | grep -qF '[no-new-version]'; then
            STATE=success
            DESCRIPTION="Version v$VERSION kept on purpose ([no-new-version]) — nothing to release."
          elif [ "${{ needs.version.outputs.tag_exists }}" = "true" ]; then
            STATE=pending
            DESCRIPTION="Version v$VERSION already released — bump <VersionPrefix> in BuildVersion.props, or add [no-new-version] to the commit message."
          elif [ "${{ steps.gh_release.outcome }}" = "success" ]; then
            STATE=success
            DESCRIPTION="Released v$VERSION with the apps and the NuGet packages."
          else
            STATE=failure
            DESCRIPTION="Release failed with an unexpected error."
          fi
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f description="$DESCRIPTION" \
            -f context="release"

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      packages: write

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      # The same packages attested and attached in the release job.
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source "$FEED_URL" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

  # nuget.org with Trusted Publishing (https://www.nuget.org/account/trustedpublishing): the
  # workflow's OIDC token is exchanged for a short-lived API key, so no key is ever stored. Set the
  # repository variable NUGET_USER to the nuget.org account owning the trusted publishing policy
  # for this workflow (ci.yml); without it, skip.
  publish-nuget:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      id-token: write # nuget.org Trusted Publishing
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}

    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$NUGET_USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The NUGET_USER repository variable isn't configured - skip nuget.org"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download NuGet artifact
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Setup .NET
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Log in to nuget.org
        id: login
        if: steps.config.outputs.enabled == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      # The .snupkg symbol packages next to each .nupkg are pushed with it.
      - name: Push to nuget.org
        if: steps.config.outputs.enabled == 'true'
        env:
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$API_KEY" \
            --skip-duplicate
          echo "### nuget.org: pushed $(ls nupkg/*.nupkg | xargs -n1 basename | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
