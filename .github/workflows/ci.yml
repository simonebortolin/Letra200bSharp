name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger of the workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DESKTOP_PROJECT: Letra200bSharp.Avalonia.Desktop/Letra200bSharp.Avalonia.Desktop.csproj
  ANDROID_PROJECT: Letra200bSharp.Avalonia.Android/Letra200bSharp.Avalonia.Android.csproj

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version from BuildVersion.props
        id: resolve
        shell: bash
        run: |
          VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' BuildVersion.props | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error file=BuildVersion.props::No tag <Version> found"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$VERSION arleady present - skip"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### Version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows (${{ matrix.rid }})
    runs-on: windows-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install android workload
        run: dotnet workload install android

      - name: Publish desktop app
        shell: bash
        run: |
          dotnet publish "$DESKTOP_PROJECT" \
            -c Release \
            -f net10.0-windows10.0.19041 \
            -p:TargetFrameworks=net10.0-windows10.0.19041 \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=$VERSION \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -p:ContinuousIntegrationBuild=true \
            -o "artifacts/${{ matrix.rid }}"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" `
                           -DestinationPath "Letra200bSharp-$env:VERSION-${{ matrix.rid }}.zip"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: '*.zip'
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install android workload
        run: dotnet workload install android

      - name: Publish desktop app
        run: |
          dotnet publish "$DESKTOP_PROJECT" \
            -c Release \
            -f net10.0 \
            -p:TargetFrameworks=net10.0 \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=$VERSION \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -p:ContinuousIntegrationBuild=true \
            -p:EnableWindowsTargeting=true \
            -o "artifacts/${{ matrix.rid }}"

      - name: Package
        run: |
          chmod +x "artifacts/${{ matrix.rid }}/Letra200bSharp.Avalonia.Desktop"
          tar -C "artifacts/${{ matrix.rid }}" \
              -czf "Letra200bSharp-${VERSION}-${{ matrix.rid }}.tar.gz" .

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: '*.tar.gz'
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'BuildVersion.props') }}
          restore-keys: nuget-android-

      - name: Install android workload
        run: dotnet workload install android

      - name: Prepare signing key
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/letra.keystore"
          echo "SIGNING_PROPS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/letra.keystore -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Publish APK
        run: |
          dotnet publish "$ANDROID_PROJECT" \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationDisplayVersion=$VERSION \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ContinuousIntegrationBuild=true \
            -p:EnableWindowsTargeting=true \
            $SIGNING_PROPS \
            -o artifacts/android

      - name: Package
        run: |
          APK="$(find artifacts/android -name '*-Signed.apk' -print -quit)"
          [ -n "$APK" ] || APK="$(find artifacts/android -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Nessun APK prodotto"
            exit 1
          fi
          cp "$APK" "Letra200bSharp-${VERSION}.apk"
          ls -lh Letra200bSharp-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: '*.apk'
          if-no-files-found: error

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-linux, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      statuses: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) \
            -exec cp {} release/ \;
          ls -lh release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.zip, release/*.tar.gz, release/*.apk'

      - name: Tag release
        id: tag
        if: needs.version.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        id: gh_release
        if: steps.tag.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: release/*

      - name: Report release status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.version.outputs.tag_exists }}" = "true" ]; then
            STATE=pending
            DESCRIPTION="Version v$VERSION already released — bump <Version> in BuildVersion.props."
          elif [ "${{ steps.gh_release.outcome }}" = "success" ]; then
            STATE=success
            DESCRIPTION="Released v$VERSION with Windows, Linux and Android artifacts."
          else
            STATE=failure
            DESCRIPTION="Release failed with an unexpected error."
          fi
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f description="$DESCRIPTION" \
            -f context="release"
